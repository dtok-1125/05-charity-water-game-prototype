<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<main>
  <section id="welcome-screen">
    

<header>
  <div class="logo-container" role="img" aria-label="charity: water logo">
    <img
      src="img/cw_logo_horizontal.png"
      alt=""
      class="brand-logo"
    >
    <img
      src="img/cw_logo_horizontal.png"
      alt=""
      class="brand-logo logo-white"
      aria-hidden="true"
    >
  </div>
</header>



    <h1>EVERY DROP COUNTS</h1>
    <p class="water-drops">💧 💧 💧</p>

    <p class="game-description">
      Collect clean water and bring it safely home.
    </p>

    <h2>HOW TO PLAY</h2>

    <p>
      Use the arrow keys to collect water from the source
      and deliver it safely to the community.
    </p>

    <p>
      Avoid obstacles — hitting one costs you 5 seconds!
    </p>

    <button id="start-button" type="button">
      START JOURNEY
    </button>
  </section>
</main>

    <script src="script.js"></script>
</body>
</html>
